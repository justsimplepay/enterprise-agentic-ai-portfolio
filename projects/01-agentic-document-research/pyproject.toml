[project]
name = "document-research"
version = "0.1.0"
description = "Model-independent document research application scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.40,<2",
    "langchain>=1,<2",
    "langgraph>=1,<2",
    "chromadb>=1,<2",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_research"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
