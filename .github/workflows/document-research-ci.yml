name: Document Research CI

on:
  push:
    paths:
      - "projects/01-agentic-document-research/**"
      - ".github/workflows/document-research-ci.yml"
  pull_request:
    paths:
      - "projects/01-agentic-document-research/**"
      - ".github/workflows/document-research-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/01-agentic-document-research
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: projects/01-agentic-document-research/uv.lock
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Streamlit startup
        run: uv run python scripts/check_startup.py
